name: Validate motion contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run doctor
      - run: npm test
        env:
          RENDER_INTEGRATION: '1'
      - run: npm run verify
      - run: npm run sheet
      - run: node scripts/render.mjs --scale=.25 --out=out/ci.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-evidence
          path: out/
